# This docker-compose file is used in integration test

services:
  litellm-gateway:
    depends_on:
      - litellm-gateway-db
    image: ghcr.io/berriai/litellm:v1.74.15-stable
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      STORE_MODEL_IN_DB: true
      DATABASE_URL: postgresql://admin:admin@litellm-gateway-db:5432/litellm-gateway
      LITELLM_MASTER_KEY: sk-master
      LITELLM_SALT_KEY: sk-salt

  litellm-gateway-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: litellm-gateway
    ports:
      - "4002:5432"

  nearai-cloud-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: nearai-cloud
    ports:
      - "3002:5432"
